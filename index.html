3. PRACTICAL — TIC-TAC-TOE GAME
<!DOCTYPE html>
<html>

<head>

    <title>Tic-Tac-Toe Game</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            text-align: center;
            margin: 0;
            padding-top: 40px;
        }

        h1 {
            color: #1e293b;
        }

        #turn {
            font-size: 20px;
            margin: 20px;
            font-weight: bold;
        }

        .board {
            width: 330px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;

            font-size: 40px;
            font-weight: bold;

            background-color: white;

            border: 2px solid #333;

            cursor: pointer;
        }

        .cell:hover {
            background-color: #e2e8f0;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <h1>Tic-Tac-Toe</h1>

    <div id="turn">
        Player X's Turn
    </div>


    <div class="board">

        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>

    </div>


    <div id="message"></div>


    <button onclick="resetGame()">
        Reset Game
    </button>


    <script>

        let board = ["", "", "", "", "", "", "", "", ""];

        let currentPlayer = "X";

        let gameOver = false;


        function makeMove(position)
        {

            if (board[position] !== "" || gameOver === true)
            {
                return;
            }


            board[position] = currentPlayer;


            document.getElementsByClassName("cell")[position].innerHTML =
                currentPlayer;


            if (checkWinner())
            {
                document.getElementById("message").innerHTML =
                    "Player " + currentPlayer + " Wins!";

                gameOver = true;

                return;
            }


            if (board.indexOf("") === -1)
            {
                document.getElementById("message").innerHTML =
                    "It's a Draw!";

                gameOver = true;

                return;
            }


            if (currentPlayer === "X")
            {
                currentPlayer = "O";
            }
            else
            {
                currentPlayer = "X";
            }


            document.getElementById("turn").innerHTML =
                "Player " + currentPlayer + "'s Turn";
        }


        function checkWinner()
        {

            let winningPatterns = [

                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],

                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],

                [0, 4, 8],
                [2, 4, 6]

            ];


            for (let i = 0; i < winningPatterns.length; i++)
            {

                let a = winningPatterns[i][0];

                let b = winningPatterns[i][1];

                let c = winningPatterns[i][2];


                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                )
                {
                    return true;
                }

            }


            return false;
        }


        function resetGame()
        {

            board = ["", "", "", "", "", "", "", "", ""];

            currentPlayer = "X";

            gameOver = false;


            let cells =
                document.getElementsByClassName("cell");


            for (let i = 0; i < cells.length; i++)
            {
                cells[i].innerHTML = "";
            }


            document.getElementById("message").innerHTML = "";

            document.getElementById("turn").innerHTML =
                "Player X's Turn";
        }

    </script>

</body>

</html>
